<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e5b820">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Punto de Venta Express</title>
  <style>
    :root{--gold:#e5b820;--dark:#101119;--panel:#1a1c27;--card:#252836;--line:#393d4e;--text:#f7f4eb;--muted:#aaaebe;--green:#20ad63;--blue:#3197d5}
    *{box-sizing:border-box}body{margin:0;background:var(--dark);color:var(--text);font-family:Arial,sans-serif;height:100vh;overflow:hidden}
    button,input{font:inherit}.top{height:68px;border-bottom:3px solid var(--gold);display:flex;align-items:center;padding:8px 16px;gap:14px}.brand{display:flex;align-items:center;gap:10px;min-width:240px}.logo{width:46px;height:46px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-weight:900}.brand b{display:block;font-size:18px}.brand small{color:var(--gold)}.nav{display:flex;gap:7px;overflow:auto}.nav button,.category button{border:1px solid var(--line);background:#1c1e29;color:var(--text);border-radius:9px;padding:10px 13px;font-weight:bold;white-space:nowrap}.nav .active,.category .active{background:var(--gold);color:#171717;border-color:var(--gold)}
    main{height:calc(100vh - 68px);display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:10px;padding:10px}.catalog,.order{background:var(--panel);border:1px solid var(--line);border-radius:13px;min-height:0}.catalog{display:flex;flex-direction:column;padding:12px}.tools{display:flex;justify-content:space-between;gap:10px;align-items:center}.category{display:flex;gap:6px;overflow:auto}.search{background:#20232f;border:1px solid var(--line);color:white;border-radius:9px;padding:11px;width:230px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:7px;margin-top:10px;overflow:auto}.product{border:1px solid var(--line);border-radius:10px;background:var(--card);color:white;padding:0;overflow:hidden;text-align:left;min-height:145px}.photo{height:86px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,#333748,#20222c)}.product span{display:block;padding:8px 9px 2px;font-weight:bold}.product strong{display:block;color:var(--gold);padding:2px 9px 8px}
    .order{display:flex;flex-direction:column;padding:12px}.order h2{font-size:19px;margin:0 0 9px}.type{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.type button{border:1px solid var(--line);background:#232632;color:white;border-radius:8px;padding:9px 4px}.type .active{background:var(--gold);color:#111}.reference{margin:8px 0;background:#20232f;border:1px solid var(--line);color:white;border-radius:8px;padding:10px}.items{flex:1;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.empty{text-align:center;color:var(--muted);padding:35px 8px}.item{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 2px;border-bottom:1px solid var(--line)}.item small{color:var(--muted)}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border:0;border-radius:7px;font-weight:bold}.total{display:flex;justify-content:space-between;font-size:23px;font-weight:900;padding:13px 2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{border:0;border-radius:9px;color:white;padding:13px 7px;font-weight:900}.print{background:#555b69}.send{background:var(--blue)}.charge{grid-column:1/-1;background:var(--green);font-size:18px}.notice{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#222;padding:12px 18px;border-radius:9px;box-shadow:0 5px 30px #0008;display:none}.mobile-cart{display:none}.screen{position:fixed;inset:0;z-index:20;background:var(--dark);padding:14px;overflow:auto;display:none}.screen.open{display:block}.screen-head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--gold);padding:5px 2px 13px}.screen-head h2{margin:0}.close-screen{border:0;background:var(--gold);border-radius:8px;padding:10px 15px;font-weight:900}.screen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:9px;margin-top:12px}.ticket{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--gold);border-radius:11px;padding:12px}.ticket h3{margin:0 0 5px}.ticket .meta{color:var(--muted);font-size:12px}.ticket ul{padding-left:21px;line-height:1.55}.ticket-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}.ticket-footer strong{font-size:20px;color:var(--gold)}.ticket-footer button{border:0;border-radius:7px;background:var(--green);color:white;padding:9px;font-weight:bold}
    @media(max-width:760px){body{height:auto;overflow:auto;padding-bottom:75px}.top{height:auto;position:sticky;top:0;background:var(--dark);z-index:3;display:grid;grid-template-columns:1fr;gap:5px;padding:7px 10px}.brand{min-width:0}.logo{width:38px;height:38px}.brand b{font-size:16px}.brand small{font-size:11px}.nav{width:100%;gap:4px}.nav button{font-size:0;padding:9px 13px;min-width:52px}.nav button::first-letter{font-size:18px}.nav button.active{font-size:11px;min-width:94px}main{height:auto;display:block;padding:7px}.catalog{min-height:0}.tools{align-items:stretch;flex-direction:column}.category button{padding:9px 12px}.search{width:100%}.products{grid-template-columns:repeat(2,1fr);max-height:none;overflow:visible}.product{min-height:132px}.photo{height:76px}.order{margin-top:8px;min-height:62vh;scroll-margin-top:112px}.actions{position:sticky;bottom:0;background:var(--panel);padding-top:8px}.mobile-cart{position:fixed;z-index:9;display:flex;align-items:center;gap:10px;left:8px;right:8px;bottom:8px;padding:8px 9px 8px 15px;border:1px solid #eac738;border-radius:13px;background:#171923;box-shadow:0 5px 25px #000b}.mobile-cart div{flex:1}.mobile-cart small{display:block;color:var(--muted);font-size:11px}.mobile-cart strong{font-size:20px}.mobile-cart button{border:0;border-radius:9px;background:var(--gold);color:#151515;padding:12px 15px;font-weight:900}.notice{bottom:82px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><div class="logo">PV</div><div><b>PUNTO DE VENTA</b><small>EXPRESS</small></div></div><nav class="nav"><button class="active">⌂ PEDIDOS</button><button id="nav-accounts">▦ CUENTAS</button><button id="nav-kitchen">♨ COCINA</button><button>▤ CORTE</button><button>⚙ NEGOCIO</button></nav></header>
  <main><section class="catalog"><div class="tools"><div class="category" id="categories"></div><input class="search" id="search" placeholder="Buscar producto…"></div><div class="products" id="products"></div></section>
  <aside class="order" id="order"><h2>PEDIDO ACTUAL</h2><div class="type" id="types"><button class="active">Mostrador</button><button>Para llevar</button><button>Mesa</button></div><input class="reference" id="reference" placeholder="Nombre, número o mesa"><div class="items" id="items"></div><div class="total"><span>TOTAL</span><span id="total">$0.00</span></div><div class="actions"><button class="print" id="print">IMPRIMIR CUENTA</button><button class="send" id="send">ENVIAR COMANDA</button><button class="charge" id="charge">COBRAR</button></div></aside></main><div class="mobile-cart"><div><small id="mobile-count">PEDIDO · 0 ARTÍCULOS</small><strong id="mobile-total">$0.00</strong></div><button onclick="document.getElementById('order').scrollIntoView({behavior:'smooth'})">VER PEDIDO ↑</button></div><section class="screen" id="screen"><div class="screen-head"><h2 id="screen-title">CUENTAS ACTIVAS</h2><button class="close-screen" onclick="closeScreen()">VOLVER</button></div><div class="screen-grid" id="screen-content"></div></section><div class="notice" id="notice"></div>
  <script>
    const data=[['Tacos','Taco de pastor',22,'🌮'],['Tacos','Taco de bistec',25,'🌮'],['Tacos','Taco de suadero',25,'🌮'],['Especiales','Gringa',65,'🫓'],['Especiales','Quesadilla',45,'🧀'],['Especiales','Alambre',120,'🍳'],['Bebidas','Agua fresca',30,'🥤'],['Bebidas','Refresco',35,'🥤'],['Extras','Orden de cebollitas',40,'🧅'],['Extras','Guacamole',45,'🥑']];
    let cart=[],category='Todos'; const money=n=>'$'+n.toFixed(2); const el=id=>document.getElementById(id); const loadOrders=()=>JSON.parse(localStorage.getItem('pv_orders')||'[]'); const saveOrders=o=>localStorage.setItem('pv_orders',JSON.stringify(o));
    function renderCategories(){const cats=['Todos',...new Set(data.map(x=>x[0]))];el('categories').innerHTML=cats.map(x=>`<button class="${x===category?'active':''}" onclick="category='${x}';renderCategories();renderProducts()">${x}</button>`).join('')}
    function renderProducts(){const q=el('search').value.toLowerCase();el('products').innerHTML=data.filter(x=>(category==='Todos'||x[0]===category)&&x[1].toLowerCase().includes(q)).map((x,i)=>`<button class="product" onclick="add('${x[1]}',${x[2]})"><div class="photo">${x[3]}</div><span>${x[1]}</span><strong>${money(x[2])}</strong></button>`).join('')}
    function add(name,price){const found=cart.find(x=>x.name===name);found?found.qty++:cart.push({name,price,qty:1});renderCart()}
    function qty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}
    function renderCart(){const total=cart.reduce((s,x)=>s+x.price*x.qty,0),count=cart.reduce((s,x)=>s+x.qty,0);el('items').innerHTML=cart.length?cart.map((x,i)=>`<div class="item"><div><b>${x.name}</b><br><small>${money(x.price*x.qty)}</small></div><div class="qty"><button onclick="qty(${i},-1)">−</button><b>${x.qty}</b><button onclick="qty(${i},1)">+</button></div></div>`).join(''):'<div class="empty">Toca un producto para comenzar el pedido</div>';el('total').textContent=money(total);el('mobile-total').textContent=money(total);el('mobile-count').textContent=`PEDIDO · ${count} ARTÍCULO${count===1?'':'S'}`}
    function flash(msg){el('notice').textContent=msg;el('notice').style.display='block';setTimeout(()=>el('notice').style.display='none',2200)}
    function sendOrder(){if(!cart.length)return flash('Agrega productos primero');const orders=loadOrders(),now=new Date(),type=document.querySelector('#types .active').textContent;const order={id:Date.now(),folio:String(Date.now()).slice(-4),type,reference:el('reference').value.trim()||type,items:cart.map(x=>({...x})),total:cart.reduce((s,x)=>s+x.price*x.qty,0),time:now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),status:'Pendiente'};orders.unshift(order);saveOrders(orders);cart=[];el('reference').value='';renderCart();flash('Comanda enviada · Folio '+order.folio)}
    function renderOrders(mode){const orders=loadOrders().filter(o=>mode==='kitchen'?o.status!=='Entregado':o.status!=='Pagado');el('screen-title').textContent=mode==='kitchen'?'COMANDAS DE COCINA':'CUENTAS ACTIVAS';el('screen-content').innerHTML=orders.length?orders.map(o=>`<article class="ticket"><h3>${o.reference} · #${o.folio}</h3><div class="meta">${o.type} · ${o.time} · ${o.status}</div><ul>${o.items.map(x=>`<li><b>${x.qty}×</b> ${x.name}</li>`).join('')}</ul><div class="ticket-footer"><strong>${money(o.total)}</strong><button onclick="advanceOrder(${o.id},'${mode}')">${mode==='kitchen'?'MARCAR ENTREGADO':'COBRAR CUENTA'}</button></div></article>`).join(''):'<div class="empty">No hay pedidos pendientes</div>';el('screen').classList.add('open')}
    function advanceOrder(id,mode){const orders=loadOrders(),order=orders.find(o=>o.id===id);if(order)order.status=mode==='kitchen'?'Entregado':'Pagado';saveOrders(orders);renderOrders(mode)} function closeScreen(){el('screen').classList.remove('open')}
    document.querySelectorAll('#types button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#types button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});el('search').oninput=renderProducts;el('send').onclick=sendOrder;el('nav-accounts').onclick=()=>renderOrders('accounts');el('nav-kitchen').onclick=()=>renderOrders('kitchen');el('print').onclick=()=>cart.length?window.print():flash('No hay productos');el('charge').onclick=()=>{if(!cart.length)return flash('No hay productos');flash('Cuenta cobrada correctamente');cart=[];renderCart()};renderCategories();renderProducts();renderCart();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
  </script>
</body></html>
